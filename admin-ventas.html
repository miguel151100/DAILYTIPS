<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Ventas | DailyTips</title>
  <link rel="icon" href="assets/dailytips-logo-cropped.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="payment-config.js"></script>
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: clamp(32px,5vw,64px) clamp(18px,4vw,48px); }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
    .stat-card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .stat-card span { display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .stat-card strong { font-size: 38px; letter-spacing: -.02em; color: var(--yellow); }
    .admin-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th { padding: 14px 16px; text-align: left; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; }
    tbody td { padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--ink-soft); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--surface-soft); }
    .price-cell { font-weight: 800; color: var(--yellow); }
    .email-cell { font-weight: 700; color: var(--ink); }
    .date-cell { white-space: nowrap; color: var(--muted); font-size: 13px; }
    .pid-cell { font-family: monospace; font-size: 12px; color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-bar input { flex: 1; min-width: 200px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; font: inherit; font-size: 14px; outline: 0; background: var(--surface); color: var(--ink); }
    .search-bar input:focus { border-color: var(--accent); }
    .pill-count { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--teal); font-size: 12px; font-weight: 800; }
    .gate-wrap { max-width: 400px; margin: clamp(80px,12vw,160px) auto; text-align: center; }
    .gate-wrap h2 { margin-bottom: 8px; }
    .gate-form { display: grid; gap: 12px; margin-top: 28px; text-align: left; }
    .gate-input { width: 100%; min-height: 52px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 14px; font: inherit; font-size: 16px; outline: 0; box-sizing: border-box; }
    .gate-input:focus { border-color: var(--accent); }
    .gate-msg { font-size: 14px; font-weight: 700; color: var(--danger); min-height: 20px; }
    .export-btn { margin-left: auto; }
    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .stats-grid .stat-card:last-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="ambient ambient--one"></div>
  <!-- Gate (shown until authenticated) -->
  <div id="gate-view">
    <div class="gate-wrap">
      <p class="eyebrow">Panel de ventas</p>
      <h2>Acceso administrativo</h2>
      <p style="color:var(--muted)">Ingresa tu código de acceso para ver las ventas.</p>
      <form class="gate-form" id="gate-form">
        <input class="gate-input" type="password" id="gate-token" placeholder="Código de acceso" autocomplete="off" required>
        <button class="button" type="submit" id="gate-btn">Entrar</button>
        <p class="gate-msg" id="gate-msg"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard (shown after auth) -->
  <div id="admin-view" hidden>
    <div class="admin-wrap">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px">
        <div>
          <p class="eyebrow" style="margin-bottom:4px">Panel de ventas</p>
          <h1 style="font-size:clamp(24px,3vw,36px);margin:0">DailyTips · Cursos</h1>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="button button--ghost" id="refresh-btn" type="button">↺ Actualizar</button>
          <button class="button button--ghost export-btn" id="export-btn" type="button">⬇ Exportar CSV</button>
          <button class="button button--ghost" id="logout-btn" type="button">Salir</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><span>Total ventas</span><strong id="stat-total">—</strong></div>
        <div class="stat-card"><span>Total recaudado</span><strong id="stat-mxn">—</strong></div>
        <div class="stat-card"><span>Compradores únicos</span><strong id="stat-unique">—</strong></div>
      </div>

      <!-- Search + table -->
      <div class="search-bar">
        <input type="search" id="table-search" placeholder="Filtrar por email o curso..." autocomplete="off">
        <span class="pill-count" id="row-count">0 ventas</span>
      </div>

      <div class="admin-table-wrap">
        <table id="ventas-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Email</th>
              <th>Curso</th>
              <th>Precio</th>
              <th>Fecha</th>
              <th>Payment ID</th>
            </tr>
          </thead>
          <tbody id="ventas-body">
            <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
  <script>
    (() => {
      const config = window.DAILYTIPS_PAYMENT_CONFIG || {};
      const apiBase = (config.apiBaseUrl || "").replace(/\/$/, "");
      const SESSION_KEY = "dt_admin_token";

      const gateView = document.getElementById("gate-view");
      const adminView = document.getElementById("admin-view");

      let allRows = [];

      // ── Auth gate ──────────────────────────────────────────────────────────
      const gateForm = document.getElementById("gate-form");
      const gateToken = document.getElementById("gate-token");
      const gateMsg = document.getElementById("gate-msg");
      const gateBtn = document.getElementById("gate-btn");

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const token = gateToken.value.trim();
        if (!token) return;
        gateBtn.disabled = true;
        gateBtn.textContent = "Verificando...";
        gateMsg.textContent = "";
        const ok = await loadData(token);
        if (ok) {
          sessionStorage.setItem(SESSION_KEY, token);
          gateView.hidden = true;
          adminView.hidden = false;
        } else {
          gateMsg.textContent = "Código incorrecto o error de red.";
        }
        gateBtn.disabled = false;
        gateBtn.textContent = "Entrar";
      });

      // Auto-login if token in session
      const savedToken = sessionStorage.getItem(SESSION_KEY);
      if (savedToken) {
        loadData(savedToken).then(ok => {
          if (ok) { gateView.hidden = true; adminView.hidden = false; }
          else { sessionStorage.removeItem(SESSION_KEY); }
        });
      }

      // ── Data loading ───────────────────────────────────────────────────────
      async function loadData(token) {
        try {
          const res = await fetch(`${apiBase}/api/admin-ventas?token=${encodeURIComponent(token)}`);
          if (!res.ok) return false;
          const data = await res.json();
          if (!data.ok) return false;
          allRows = data.ventas || [];
          renderStats(data);
          renderTable(allRows);
          return true;
        } catch { return false; }
      }

      function renderStats({ total, totalRecaudado, uniqueEmails }) {
        document.getElementById("stat-total").textContent = total || 0;
        document.getElementById("stat-mxn").textContent = `$${(totalRecaudado || 0).toLocaleString("es-MX")} MXN`;
        document.getElementById("stat-unique").textContent = uniqueEmails || 0;
      }

      function fmtDate(iso) {
        if (!iso) return "—";
        return new Date(iso).toLocaleDateString("es-MX", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      function renderTable(rows) {
        const tbody = document.getElementById("ventas-body");
        document.getElementById("row-count").textContent = `${rows.length} venta${rows.length !== 1 ? "s" : ""}`;

        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">Sin resultados</td></tr>`;
          return;
        }

        tbody.innerHTML = rows.map((r, i) => `
          <tr>
            <td style="color:var(--muted);font-size:12px">${i + 1}</td>
            <td class="email-cell">${r.email}</td>
            <td>${r.title}</td>
            <td class="price-cell">$${r.price} MXN</td>
            <td class="date-cell">${fmtDate(r.fechaCompra)}</td>
            <td class="pid-cell" title="${r.paymentId || ""}">${r.paymentId || "—"}</td>
          </tr>`).join("");
      }

      // ── Search ─────────────────────────────────────────────────────────────
      document.getElementById("table-search").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = q ? allRows.filter(r =>
          r.email.toLowerCase().includes(q) || r.title.toLowerCase().includes(q)
        ) : allRows;
        renderTable(filtered);
      });

      // ── Controls ───────────────────────────────────────────────────────────
      document.getElementById("refresh-btn").addEventListener("click", () => {
        const token = sessionStorage.getItem(SESSION_KEY);
        if (token) loadData(token);
      });

      document.getElementById("logout-btn").addEventListener("click", () => {
        sessionStorage.removeItem(SESSION_KEY);
        adminView.hidden = true;
        gateView.hidden = false;
        gateToken.value = "";
      });

      document.getElementById("export-btn").addEventListener("click", () => {
        if (!allRows.length) return;
        const headers = ["Email", "Curso", "Precio MXN", "Fecha", "Payment ID"];
        const rows = allRows.map(r => [
          `"${r.email}"`,
          `"${r.title}"`,
          r.price,
          `"${r.fechaCompra || ""}"`,
          `"${r.paymentId || ""}"`
        ].join(","));
        const csv = [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `ventas-dailytips-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });
    })();
  </script>
</body>
</html>
