name: fx-ai-trader tests

on:
  push:
    branches: ["**"]
    paths:
      - "fx-ai-trader/**"
      - ".github/workflows/fx-ai-trader-tests.yml"
  pull_request:
    paths:
      - "fx-ai-trader/**"
      - ".github/workflows/fx-ai-trader-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fx-ai-trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fx-ai-trader/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
